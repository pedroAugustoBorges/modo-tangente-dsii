<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(${titulo}, ~{:: corpo}, true)}">
<body>
<th:block th:fragment="corpo">
    <section th:replace="~{estudo/pagina :: pagina(${titulo}, ~{:: lista})}">
        <div th:fragment="lista">
            <a class="study-back" th:if="${voltar}" th:href="@{${voltar}}" data-study-nav="back" data-study-part>
                <span class="study-back-arrow" aria-hidden="true">←</span>
                Voltar aos tópicos
            </a>
            <p class="feedback feedback-error" th:if="${erro}" role="alert" th:text="${erro}">Não foi possível carregar o catálogo.</p>
            <th:block th:unless="${erro}">
                <p class="empty-state" th:if="${#lists.isEmpty(itens)}" th:text="${mensagemVazia}">Nenhum item disponível.</p>
                <ul class="catalog-list" th:unless="${#lists.isEmpty(itens)}">
                    <li th:each="item : ${itens}" data-study-part>
                        <form th:if="${abrirTopico}" method="post" th:action="@{${item.url}}" data-study-nav="forward">
                            <button class="topic-entry" type="submit">
                                <span th:text="${item.titulo}">Tópico</span>
                                <span class="list-arrow" aria-hidden="true">→</span>
                            </button>
                        </form>
                        <a th:unless="${abrirTopico}" th:href="@{${item.url}}" data-study-nav="forward">
                            <span th:text="${item.titulo}">Título</span>
                            <span class="list-arrow" aria-hidden="true">→</span>
                        </a>
                    </li>
                </ul>
            </th:block>
        </div>
    </section>
</th:block>
</body>
</html>
