<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Catálogo de estudo</title>
</head>
<body>
<main>
    <section th:replace="~{estudo/pagina :: pagina(${titulo}, ~{:: lista})}">
        <div th:fragment="lista">
            <p th:if="${erro}" role="alert" th:text="${erro}">Não foi possível carregar o catálogo.</p>
            <th:block th:unless="${erro}">
                <p th:if="${#lists.isEmpty(itens)}" th:text="${mensagemVazia}">Nenhum item disponível.</p>
                <ul th:unless="${#lists.isEmpty(itens)}">
                    <li th:each="item : ${itens}">
                        <a th:href="${item.url}" th:text="${item.titulo}">Título</a>
                    </li>
                </ul>
            </th:block>
        </div>
    </section>
</main>
</body>
</html>
