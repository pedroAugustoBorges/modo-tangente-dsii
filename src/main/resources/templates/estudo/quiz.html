<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(${quiz.title}, ~{:: corpo}, true)}">
<body>
<section class="surface" th:fragment="corpo">
    <h1 th:text="${quiz.title}">Quiz</h1>
    <p th:if="${quiz.description}" th:text="${quiz.description}"></p>
    <p th:if="${quiz.instructions}" th:text="${quiz.instructions}"></p>
    <p th:unless="${disponivel}">Este quiz ainda não tem questões publicadas.</p>
    <p><a th:href="@{/estudo/topicos/{id}(id=${quiz.topicId})}">Voltar ao tópico</a></p>
</section>
</body>
</html>
