<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(${quiz.title}, ~{:: corpo}, true)}">
<body>
<section class="surface" th:fragment="corpo">
    <h1 th:text="${quiz.title}">Quiz</h1>
    <p class="muted" th:if="${quiz.description}" th:text="${quiz.description}"></p>
    <p class="feedback" th:if="${quiz.instructions}" th:text="${quiz.instructions}"></p>
    <p th:unless="${disponivel}">Este quiz ainda não tem questões publicadas.</p>
    <p class="feedback feedback-error" th:if="${erro}" role="alert" th:text="${erro}"></p>
    <div class="quiz-actions">
        <form th:if="${disponivel}" method="post" th:action="@{/estudo/quizzes/{id}/tentativas(id=${quiz.id})}">
            <button class="button" type="submit">Iniciar tentativa</button>
        </form>
        <a class="button button-secondary" th:href="@{/estudo/tentativas}">Minhas tentativas</a>
    </div>
    <p><a th:href="@{/estudo/topicos/{id}(id=${quiz.topicId})}">Voltar ao tópico</a></p>
</section>
</body>
</html>
