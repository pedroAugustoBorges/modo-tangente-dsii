<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(${titulo}, ~{:: corpo}, true)}">
<body>
<th:block th:fragment="corpo">
    <section th:replace="~{estudo/pagina :: pagina(${titulo}, ~{:: conteudoQuestao})}">
        <div th:fragment="conteudoQuestao">
            <p th:text="|Questão ${posicao} de ${totalQuestoes}|">Questão 1 de 3</p>
            <fieldset class="question-options" th:disabled="${respondida}">
                <legend th:text="${enunciado}">Enunciado da questão</legend>
                <ul class="option-list">
                    <li th:each="alternativa : ${alternativas}">
                        <label>
                            <input type="radio" name="optionId" th:value="${alternativa.id}"
                                   th:checked="${alternativa.id == alternativaSelecionadaId}">
                            <span th:text="${alternativa.texto}">Alternativa</span>
                        </label>
                    </li>
                </ul>
            </fieldset>
            <p class="feedback" th:if="${respondida}">Questão respondida.</p>
        </div>
    </section>
</th:block>
</body>
</html>
