<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina('Entrar', ~{:: corpo}, false)}">
<body>
<section class="surface login-card" th:fragment="corpo">
    <div class="login-mark" aria-hidden="true">↗</div>
    <h1>Entrar no Modo Tangente</h1>
    <p class="feedback feedback-error" th:if="${param.error != null}" role="alert">Confira o e-mail e a senha.</p>
    <p class="feedback" th:if="${param.logout != null}" role="status">Você saiu da sua conta.</p>
    <p class="feedback feedback-success" th:if="${param.registered != null}" role="status">Conta criada. Entre com seu e-mail e senha.</p>
    <form class="login-form" method="post" th:action="@{/login}">
        <div>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button" type="submit">Entrar</button>
    </form>
    <p class="auth-switch">Ainda não tem conta? <a th:href="@{/cadastro}">Criar cadastro</a></p>
</section>
</body>
</html>
