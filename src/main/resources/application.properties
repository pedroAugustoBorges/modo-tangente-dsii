spring.application.name=modo-tangente
spring.profiles.default=local
spring.jpa.open-in-view=false
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
openrouter.max-output-tokens=${OPENROUTER_MAX_OUTPUT_TOKENS:600}
openrouter.max-history-exchanges=${OPENROUTER_MAX_HISTORY_EXCHANGES:8}
openrouter.max-input-characters=${OPENROUTER_MAX_INPUT_CHARACTERS:12000}
openrouter.connect-timeout=${OPENROUTER_CONNECT_TIMEOUT:PT3S}
openrouter.read-timeout=${OPENROUTER_READ_TIMEOUT:PT30S}
tutor.processing-timeout=${TUTOR_PROCESSING_TIMEOUT:PT2M}
