openapi: 3.0.3
info:
  title: Modo Tangente API
  version: 0.5.0
  description: Contratos de sessão, tentativas, respostas, conversas e mensagens. Requer sessão autenticada.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/me:
    get:
      operationId: getCurrentUser
      summary: Consulta a conta da sessão atual
      responses:
        '200':
          description: Identidade da conta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserView'
        '302':
          description: Sessão ausente, com redirecionamento para o login
        '401':
          description: Conta da sessão inativa ou indisponível
  /api/quizzes/{quizId}/attempts:
    post:
      operationId: startQuizAttempt
      summary: Inicia uma tentativa e prepara o progresso das questões ativas
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Tentativa iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptSummary'
        '401':
          description: Usuário não autenticado ou conta inativa
        '404':
          description: Quiz inexistente ou inativo
  /api/attempts/{attemptId}:
    get:
      operationId: getQuizAttempt
      summary: Consulta uma tentativa própria com o progresso por questão
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Tentativa e progresso ordenado pela posição no quiz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAttemptDetail'
        '401':
          description: Usuário não autenticado ou conta inativa
        '404':
          description: Tentativa inexistente ou pertencente a outro usuário
  /api/attempts/{attemptId}/questions/{questionId}/answer:
    post:
      operationId: answerAttemptQuestion
      summary: Registra a alternativa escolhida pelo aluno
      description: A primeira resposta é final nesta tentativa. Repetir a mesma alternativa é idempotente; enviar outra alternativa para a questão respondida retorna conflito.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerQuestionRequest'
      responses:
        '200':
          description: Resposta validada e correção calculada pelo backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionAttemptProgress'
        '400':
          description: Corpo inválido ou alternativa não positiva
        '401':
          description: Usuário não autenticado ou conta inativa
        '404':
          description: Tentativa, questão ou alternativa não encontrada para o usuário e questão
        '409':
          description: Tentativa encerrada ou questão já respondida com outra alternativa
  /api/attempts/{attemptId}/questions/{questionId}/conversation:
    get:
      operationId: getAttemptQuestionConversation
      summary: Consulta a conversa já criada para uma questão da tentativa
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Conversa existente, ainda sem mensagens neste incremento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '401':
          description: Usuário não autenticado ou conta inativa
        '404':
          description: Tentativa alheia/inexistente, questão não vinculada ou conversa ainda não criada
    post:
      operationId: getOrCreateAttemptQuestionConversation
      summary: Cria ou recupera a conversa única da questão nesta tentativa
      description: A criação é lazy e protegida por ownership. Repetir a chamada retorna a conversa existente. Conversas não são criadas ao iniciar o quiz.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Conversa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '200':
          description: Conversa que já existia para esta questão e tentativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '401':
          description: Usuário não autenticado ou conta inativa
        '404':
          description: Tentativa alheia/inexistente ou questão não vinculada à tentativa
  /api/conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      summary: Lista o histórico ordenado de uma conversa própria
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Mensagens ordenadas por data de criação e ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageView'
        '401':
          description: Usuário não autenticado ou conta inativa
        '404':
          description: Conversa inexistente ou pertencente a outro usuário
    post:
      operationId: sendConversationMessage
      summary: Persiste uma mensagem do aluno e solicita uma resposta do tutor
      description: O backend valida a propriedade da conversa, recebe somente conteúdo e requestId, carrega contexto didático pelo QuizContextProvider e chama o adaptador OpenRouter. A chave permanece no servidor. Repetir o mesmo requestId e conteúdo não duplica mensagens; reutilizar o ID com outro conteúdo retorna conflito.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Nova mensagem e resposta do tutor persistidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExchangeResponse'
        '200':
          description: Resultado concluído recuperado por requestId ou retry concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExchangeResponse'
        '202':
          description: Requisição com esse requestId ainda está dentro do prazo de processamento; após o timeout configurado, uma repetição recupera a solicitação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageExchangeResponse'
        '400':
          description: Conteúdo vazio ou requestId ausente/inválido
        '401':
          description: Usuário não autenticado ou conta inativa
        '404':
          description: Conversa inexistente ou pertencente a outro usuário
        '409':
          description: requestId já usado com conteúdo diferente
        '502':
          description: Tutor indisponível; mensagem fica registrada como FAILED e pode ser reenviada
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token CSRF associado à sessão Spring Security.
      schema:
        type: string
  schemas:
    CurrentUserView:
      type: object
      required: [id, fullName, email, role]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [STUDENT, ADMIN]
    QuizAttemptSummary:
      type: object
      required: [id, quizId, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
        quizId:
          type: integer
          format: int64
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, ABANDONED]
        score:
          type: number
          format: double
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
    QuizAttemptDetail:
      allOf:
        - $ref: '#/components/schemas/QuizAttemptSummary'
        - type: object
          required: [questionAttempts]
          properties:
            questionAttempts:
              type: array
              items:
                $ref: '#/components/schemas/QuestionAttemptProgress'
    AnswerQuestionRequest:
      type: object
      required: [selectedOptionId]
      properties:
        selectedOptionId:
          type: integer
          format: int64
          minimum: 1
    QuestionAttemptProgress:
      type: object
      required: [questionId, position, answered]
      properties:
        questionId:
          type: integer
          format: int64
        position:
          type: integer
        selectedOptionId:
          type: integer
          format: int64
          nullable: true
        answered:
          type: boolean
        isCorrect:
          type: boolean
          nullable: true
        answeredAt:
          type: string
          format: date-time
          nullable: true
    ConversationSummary:
      type: object
      required: [id, questionAttemptId, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        questionAttemptId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      required: [content, requestId]
      properties:
        content:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
    MessageView:
      type: object
      required: [id, senderRole, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        senderRole:
          type: string
          enum: [STUDENT, TUTOR]
        content:
          type: string
        requestId:
          type: string
          format: uuid
          nullable: true
        replyToMessageId:
          type: integer
          format: int64
          nullable: true
        llmStatus:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
          nullable: true
        createdAt:
          type: string
          format: date-time
    MessageExchangeResponse:
      type: object
      required: [studentMessage, tutorMessage]
      properties:
        studentMessage:
          $ref: '#/components/schemas/MessageView'
        tutorMessage:
          allOf:
            - $ref: '#/components/schemas/MessageView'
          nullable: true
